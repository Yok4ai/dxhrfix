; dxhrfix.ini: settings for the dxhrfix DFEngine.dll proxy (Deus Ex: Human
; Revolution Director's Cut). Put this file next to DXHRDC.exe.
; A missing file or a missing key means the built-in default. The values
; below are the release defaults; the built-in default differs only for
; ad_sdk (built-in 1, see below).
; Changes take effect the next time the game starts.

[dxhrfix]

; Master switch. 1 = install all fix hooks and patches. 0 = no fix patches:
; the game runs stock and the DLL only forwards the ad SDK and writes the log.
; The hitch profiler at the end of this file has its own switch (profiler=).
hooks=1

; Hook B: create the pixel shaders of every loaded shader library on a DLL
; thread pool before they are first drawn. 1 = on, 0 = off. Needs hooks=1.
precreate=1

; Precreate pool size. auto (or 0) = min(4, CPU cores - 2), at least 1.
; Any number from 1 to 8 sets it explicitly.
pool_threads=auto

; Upper limit on pool shader creations per second, spread over the pool.
; 0 = unlimited.
precreate_max_per_sec=0

; DXGI maximum frame latency (the game hardcodes 1). Clamped to 1..4.
; 1 = stock, nothing patched.
frame_latency=2

; Log detail in dxhrfix.log. 0 = install lines only, 1 = also per library
; precreate lines, the first events of each kind and totals every 10 s,
; 2 = every event (large and slow, for debugging only).
log_level=1

; 1 = forward the in-game ad SDK to DFEngine_orig.dll (the original
; DFEngine.dll) when present. 0 = use a built-in stub that disables it.
; Release default 0 (built-in default when the key is missing: 1). The ad
; network is gone, and the SDK still blocks the game's main thread on
; socket and connectivity calls (profiled at 120 ms frames during gameplay).
; The game handles a missing ad SDK on its own.
ad_sdk=0

; Cursor call dedupe (needs hooks=1). The game calls ShowCursor in a loop,
; SetCursor and ClipCursor every frame; under Wine each call is a wineserver
; round trip and some go to the X server (profiled at 110 ms frames while
; moving the mouse). 1 = keep a shadow ShowCursor count and only pass
; visibility changes, changed cursors and changed clip rects to Windows.
cursor_fix=1

; SetCursor / ClipCursor: also pass an unchanged call through at least this
; often (ms), so a cursor or clip reset by the system (alt-tab) is restored.
; 0 = only on change.
cursor_refresh_ms=250

; ---- hitch profiler (diagnostics) ----
; Samples what the render, main, async create and file system threads are
; doing and, for every frame longer than profiler_hitch_ms, writes a report to
; dxhrfix_hitch.log next to dxhrfix.log. Independent of hooks= (hooks=0 with
; profiler=1 profiles the stock game). Needs dxhrfix_syms.tsv next to
; DFEngine.dll for game function names (works without it, with raw addresses).
; 1 = on, 0 = off (no thread, no patch at all). Off by default: it costs
; a few percent of frame time. To report a stutter bug, set profiler=1, play
; until the stutter happens, quit, and attach dxhrfix_hitch.log together with
; dxhrfix.log.
profiler=0

; Samples per second per tracked thread. Under Proton each sample suspends
; the thread for about 0.2 ms, so 250 Hz costs each tracked thread about 5%
; of its time; 1000 Hz costs about 15%. 50..4000.
profiler_hz=250

; A frame (time between two Presents on the render thread) longer than this
; many milliseconds is reported.
profiler_hitch_ms=40

; Maximum number of reports per game session.
profiler_max_dumps=200

; Sample history kept in memory, in milliseconds (100..4000). A frame longer
; than this is reported with its oldest part missing (the report says so).
profiler_ring_ms=1000

; Which threads are sampled besides main, render, async create and file
; system: 0 = none, 1 = the game's other own threads, 2 = every thread in the
; process, including DXVK's (shader compile, submit, present). At most 16
; threads are sampled, in that order of preference. Each sampled thread costs
; one suspend per sample.
profiler_extra_threads=2

; 1 = count the game's ReadFile calls per thread and show the ones that
; overlap each slow frame.
profiler_readfile=1
